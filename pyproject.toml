[project]
name = "churn-api"
version = "1.0.0"
description = "Customer churn prediction: scikit-learn training pipeline served with FastAPI"
readme = "README.md"
license = "MIT"
authors = [{ name = "Nikhil Sharma" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "joblib>=1.3",
]

[project.scripts]
churn-train = "churn_api.train:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn_api"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
